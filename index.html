<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07549a"><link rel="manifest" href="manifest.webmanifest"><title>Mein Krafttraining</title><style>
:root{--blue:#07549a;--light:#d2eaf8;--pale:#eff8fd;--ink:#263442;--muted:#475766;--line:#c9dfed;--green:#287a48;--orange:#a96a0a;--red:#b43e3e}*{box-sizing:border-box}html{font-size:18px}body{margin:0;background:#f5fafd;color:var(--ink);font-family:Arial,Helvetica,sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom));line-height:1.45}header{background:linear-gradient(140deg,var(--blue),#2478b8);color:white;padding:calc(22px + env(safe-area-inset-top)) 20px 24px}header h1{font:700 2rem Georgia,'Times New Roman',serif;margin:0}header p{margin:4px 0 0;font-size:1rem;color:#edf8ff}main{max-width:780px;margin:0 auto;padding:14px}.panel,.item{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #07549a0c}.panel h2{font:700 1.5rem Georgia,serif;color:var(--blue);margin:0 0 12px}.panel h3{font-size:1.15rem}label{display:block;font-weight:700;margin:15px 0 6px;font-size:1rem}input,select,textarea{width:100%;min-height:56px;border:2px solid #a7c7db;border-radius:12px;background:#fff;color:var(--ink);font:inherit;padding:12px}input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #f1ad3b;outline-offset:2px}button{font:700 1rem Arial,sans-serif;border:0;border-radius:12px;background:var(--blue);color:#fff;padding:13px 17px;min-height:56px;cursor:pointer;margin:6px 5px 3px 0}button.secondary{background:var(--light);color:#063c70}button.danger{background:#a63239}button.small{font-size:.95rem;min-height:52px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.item h3{font-size:1.12rem;margin:0 0 5px}.item>div:first-child{min-width:0;flex:1}.sub{color:var(--muted);font-size:.96rem}.dot{display:inline-block;width:15px;height:15px;border-radius:50%;margin-right:9px}.green{background:var(--green)}.orange{background:var(--orange)}.red{background:var(--red)}.status{font-size:1rem;font-weight:700}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}}canvas{width:100%;height:240px;border:1px solid var(--line);border-radius:12px;background:white}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--light);border-top:2px solid #a8d1eb;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 5px calc(8px + env(safe-area-inset-bottom));gap:4px}.tabs button{background:transparent;color:#164d78;min-height:56px;font-size:.84rem;padding:8px 2px;margin:0;border-radius:10px}.tabs button.active{background:var(--blue);color:white}.tabs .ico{display:block;font-size:1.35rem;line-height:1.2}#langSwitch{background:white;color:var(--blue);border:2px solid var(--line);width:auto;min-height:52px;font-weight:bold}header .headrow{display:flex;justify-content:space-between;align-items:center;gap:12px}.note{background:var(--pale);border-radius:12px;padding:12px;margin:12px 0}#editBanner{border-left:5px solid var(--blue)}.actions{display:flex;flex-wrap:wrap;gap:5px}.actions button{margin:0}#historyList .item{align-items:flex-start}@media(max-width:360px){.tabs button{font-size:.72rem}header h1{font-size:1.7rem}}
</style></head><body><header><div class="headrow"><h1 data-i="title">Mein Krafttraining</h1><select id="langSwitch" aria-label="Language"><option value="de">Deutsch</option><option value="en">English</option></select></div><p data-i="subtitle">Training dokumentieren · Fortschritt verfolgen</p></header><main>
<section id="status" class="tab"><div class="panel"><h2 data-i="exercises">Geräte & Übungen</h2><p class="sub" data-i="sortInfo">Am längsten nicht trainierte Übungen zuerst.</p><div id="exerciseList"></div><label for="newExercise" data-i="newExercise">Neue Übung / neues Gerät</label><input id="newExercise"><button id="addExercise" data-i="addExercise">Übung hinzufügen</button></div></section>
<section id="log" class="tab hidden"><div class="panel"><h2 data-i="logTitle">Training speichern</h2><div id="editBanner" class="note hidden"><b data-i="editing">Eintrag bearbeiten</b><button class="secondary" id="cancelEdit" data-i="cancelEdit">Abbrechen</button></div><label for="logExercise" data-i="exercise">Übung / Gerät</label><select id="logExercise"></select><div class="grid"><div><label for="logDate" data-i="date">Datum</label><input type="date" id="logDate"></div><div><label for="weight" data-i="weight">Gewicht (kg)</label><input type="number" id="weight" min="0" step="0.5"></div><div><label for="sets" data-i="sets">Sätze</label><input type="number" id="sets" min="1" value="3"></div><div><label for="reps" data-i="reps">Wiederholungen je Satz</label><input type="number" id="reps" min="1" value="10"></div></div><label for="notes" data-i="notes">Notiz (optional)</label><textarea id="notes" rows="2"></textarea><button id="saveLog" data-i="saveLog">Training speichern</button></div></section>
<section id="charts" class="tab hidden"><div class="panel"><h2 data-i="progress">Leistungsentwicklung</h2><label for="chartExercise" data-i="chooseExercise">Übung auswählen</label><select id="chartExercise"></select><p class="sub" data-i="chartInfo">Gewicht und Wiederholungen im zeitlichen Verlauf.</p><h3 data-i="weight">Gewicht (kg)</h3><canvas id="weightChart" width="700" height="240"></canvas><h3 data-i="reps">Wiederholungen je Satz</h3><canvas id="repsChart" width="700" height="240"></canvas></div></section>
<section id="history" class="tab hidden"><div class="panel"><h2 data-i="history">Trainingsverlauf</h2><div id="historyList"></div><button class="secondary" id="export" data-i="export">Backup exportieren</button><label for="importFile" data-i="import">Backup wiederherstellen (JSON)</label><input type="file" id="importFile" accept="application/json"></div></section></main>
<nav class="tabs" aria-label="Navigation"><button data-tab="status" class="active"><span class="ico">⌂</span><span data-i="overview">Übersicht</span></button><button data-tab="log"><span class="ico">＋</span><span data-i="training">Training</span></button><button data-tab="charts"><span class="ico">↗</span><span data-i="progressTab">Fortschritt</span></button><button data-tab="history"><span class="ico">▤</span><span data-i="historyTab">Verlauf</span></button></nav>
<script>
'use strict';
const KEY='myKrafttraining.entries.v1',EXKEY='myKrafttraining.customExercises.v1',LANGKEY='myKrafttraining.language.v1';
const $=id=>document.getElementById(id),today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
function read(key){try{let v=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(v)?v:[]}catch{return []}}
let entries=read(KEY),custom=read(EXKEY),lang=localStorage.getItem(LANGKEY)==='en'?'en':'de',editIndex=null;
const translations={de:{title:'Mein Krafttraining',subtitle:'Training dokumentieren · Fortschritt verfolgen',exercises:'Geräte & Übungen',sortInfo:'Am längsten nicht trainierte Übungen zuerst.',newExercise:'Neue Übung / neues Gerät',addExercise:'Übung hinzufügen',logTitle:'Training speichern',editing:'Eintrag bearbeiten',cancelEdit:'Abbrechen',exercise:'Übung / Gerät',date:'Datum',weight:'Gewicht (kg)',sets:'Sätze',reps:'Wiederholungen je Satz',notes:'Notiz (optional)',saveLog:'Training speichern',saveChanges:'Änderungen speichern',progress:'Leistungsentwicklung',chooseExercise:'Übung auswählen',chartInfo:'Gewicht und Wiederholungen im zeitlichen Verlauf.',history:'Trainingsverlauf',export:'Backup exportieren',import:'Backup wiederherstellen (JSON)',overview:'Übersicht',training:'Training',progressTab:'Fortschritt',historyTab:'Verlauf',never:'Noch nie trainiert',days:n=>`vor ${n} Tag(en)`,emptyExercises:'Noch keine Übungen. Füge deine erste Übung hinzu.',emptyHistory:'Noch keine Trainings eingetragen.',remove:'Entfernen',edit:'Bearbeiten',delete:'Löschen',duplicate:'Diese Übung gibt es bereits.',removeConfirm:n=>`„${n}“ entfernen? Alte Trainingseinträge bleiben erhalten.`,deleteConfirm:'Diesen Trainingseintrag wirklich löschen?',missing:'Bitte Übung, Sätze und Wiederholungen ausfüllen.',saved:'Training gespeichert.',updated:'Eintrag aktualisiert.',noData:'Noch keine Daten vorhanden',backupConfirm:'Aktuelle Daten durch das Backup ersetzen?',restored:'Backup wiederhergestellt.',invalid:'Ungültige Backup-Datei.'},en:{title:'My Strength Training',subtitle:'Log workouts · Track progress',exercises:'Equipment & exercises',sortInfo:'Exercises not trained for the longest time appear first.',newExercise:'New exercise / equipment',addExercise:'Add exercise',logTitle:'Save workout',editing:'Edit entry',cancelEdit:'Cancel',exercise:'Exercise / equipment',date:'Date',weight:'Weight (kg)',sets:'Sets',reps:'Repetitions per set',notes:'Notes (optional)',saveLog:'Save workout',saveChanges:'Save changes',progress:'Progress charts',chooseExercise:'Choose exercise',chartInfo:'Weight and repetitions over time.',history:'Workout history',export:'Export backup',import:'Restore backup (JSON)',overview:'Overview',training:'Workout',progressTab:'Progress',historyTab:'History',never:'Never trained',days:n=>`${n} day(s) ago`,emptyExercises:'No exercises yet. Add your first exercise.',emptyHistory:'No workouts recorded yet.',remove:'Remove',edit:'Edit',delete:'Delete',duplicate:'This exercise already exists.',removeConfirm:n=>`Remove “${n}”? Previous workouts will remain.`,deleteConfirm:'Delete this workout entry?',missing:'Please enter an exercise, sets and repetitions.',saved:'Workout saved.',updated:'Entry updated.',noData:'No data yet',backupConfirm:'Replace current data with the backup?',restored:'Backup restored.',invalid:'Invalid backup file.'}};
const t=(k,...args)=>{let v=translations[lang][k];return typeof v==='function'?v(...args):v};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function exercises(){return [...new Set(custom)]}
function lastDate(ex){return entries.filter(x=>x.exercise===ex).map(x=>x.date).sort().at(-1)||''}
function daysSince(d){if(!d)return null;let a=new Date(today()+'T12:00:00'),b=new Date(d+'T12:00:00');return Math.max(0,Math.floor((a-b)/86400000))}
function status(ex){let n=daysSince(lastDate(ex));return n===null?['red',t('never')]:[n<=2?'green':n<=4?'orange':'red',t('days',n)]}
function save(){localStorage.setItem(KEY,JSON.stringify(entries));localStorage.setItem(EXKEY,JSON.stringify(custom));render()}
function applyLang(){$('langSwitch').value=lang;document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i)});$('newExercise').placeholder=lang==='de'?'z. B. Beinpresse':'e.g. Leg press';$('weight').placeholder=lang==='de'?'z. B. 40':'e.g. 40';$('saveLog').textContent=t(editIndex===null?'saveLog':'saveChanges');render()}
function render(){let sorted=exercises().slice().sort((a,b)=>{let da=daysSince(lastDate(a)),db=daysSince(lastDate(b));return (da===null?-1:-da)-(db===null?-1:-db)});
$('exerciseList').innerHTML=sorted.map(ex=>{let [c,s]=status(ex);return `<div class="item"><div><h3><span class="dot ${c}"></span>${esc(ex)}</h3><div class="status">${esc(s)}</div></div><button class="danger small" data-remove="${esc(ex)}">${t('remove')}</button></div>`}).join('')||`<p class="sub">${t('emptyExercises')}</p>`;
for(let id of ['logExercise','chartExercise']){let select=$(id),old=select.value;let names=exercises();if(id==='chartExercise')names=[...new Set([...names,...entries.map(x=>x.exercise)])];if(id==='logExercise'&&editIndex!==null&&entries[editIndex])names=[...new Set([...names,entries[editIndex].exercise])];select.innerHTML=names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');if(names.includes(old))select.value=old}
$('historyList').innerHTML=entries.map((x,i)=>({...x,_index:i})).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="item"><div><b>${esc(x.exercise)}</b><div class="sub">${esc(x.date)} · ${x.weight!==''&&x.weight!=null?esc(x.weight)+' kg · ':''}${esc(x.sets)} × ${esc(x.reps)}${x.notes?' · '+esc(x.notes):''}</div></div><div class="actions"><button class="secondary small" data-edit="${x._index}">${t('edit')}</button><button class="danger small" data-delete="${x._index}">${t('delete')}</button></div></div>`).join('')||`<p class="sub">${t('emptyHistory')}</p>`;
drawCharts()}
function switchTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('hidden',x.id!==id));document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===id);b.setAttribute('aria-current',b.dataset.tab===id?'page':'false')});if(id==='charts')drawCharts();window.scrollTo(0,0)}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
$('langSwitch').onchange=e=>{lang=e.target.value;localStorage.setItem(LANGKEY,lang);applyLang()};
$('addExercise').onclick=()=>{let v=$('newExercise').value.trim();if(!v)return;if(exercises().some(x=>x.toLowerCase()===v.toLowerCase()))return alert(t('duplicate'));custom.push(v);$('newExercise').value='';save()};
$('exerciseList').onclick=e=>{let b=e.target.closest('[data-remove]');if(!b)return;let ex=b.dataset.remove;if(confirm(t('removeConfirm',ex))){custom=custom.filter(x=>x!==ex);save()}};
function suggest(){if(editIndex!==null)return;let ex=$('logExercise').value;let last=entries.filter(x=>x.exercise===ex).sort((a,b)=>a.date.localeCompare(b.date)).at(-1);$('weight').value=last?.weight??'';$('sets').value=last?.sets??3;$('reps').value=last?.reps??10}
$('logExercise').onchange=suggest;
function cancelEdit(){editIndex=null;$('editBanner').classList.add('hidden');$('saveLog').textContent=t('saveLog');$('logDate').value=today();$('notes').value='';render();suggest()}
$('cancelEdit').onclick=cancelEdit;
$('saveLog').onclick=()=>{let exercise=$('logExercise').value,weight=$('weight').value,sets=+$('sets').value,reps=+$('reps').value;if(!exercise||!Number.isInteger(sets)||sets<1||!Number.isInteger(reps)||reps<1)return alert(t('missing'));let entry={exercise,date:$('logDate').value||today(),weight,sets,reps,notes:$('notes').value};let editing=editIndex!==null;if(editing)entries[editIndex]=entry;else entries.push(entry);cancelEdit();save();alert(t(editing?'updated':'saved'))};
$('historyList').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.edit!==undefined){editIndex=+b.dataset.edit;let x=entries[editIndex];switchTab('log');render();$('logExercise').value=x.exercise;$('logDate').value=x.date;$('weight').value=x.weight;$('sets').value=x.sets;$('reps').value=x.reps;$('notes').value=x.notes||'';$('editBanner').classList.remove('hidden');$('saveLog').textContent=t('saveChanges')}else if(b.dataset.delete!==undefined&&confirm(t('deleteConfirm'))){let i=+b.dataset.delete;entries.splice(i,1);if(editIndex===i)cancelEdit();else if(editIndex!==null&&i<editIndex)editIndex--;save()}};
function draw(id,vals,label){let c=$(id),ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#c9dfed';ctx.fillStyle='#475766';ctx.font='18px Arial';for(let i=0;i<5;i++){let y=25+i*(h-65)/4;ctx.beginPath();ctx.moveTo(48,y);ctx.lineTo(w-15,y);ctx.stroke()}if(!vals.length){ctx.fillText(t('noData'),55,115);return}let max=Math.max(...vals.map(v=>v.y),1),min=Math.min(0,...vals.map(v=>v.y)),span=max-min||1;ctx.fillText(label,8,18);ctx.strokeStyle='#07549a';ctx.lineWidth=4;ctx.beginPath();vals.forEach((v,i)=>{let x=55+(vals.length===1?0:i*(w-90)/(vals.length-1)),y=25+(max-v.y)*(h-75)/span;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();vals.forEach((v,i)=>{let x=55+(vals.length===1?0:i*(w-90)/(vals.length-1)),y=25+(max-v.y)*(h-75)/span;ctx.fillStyle='#07549a';ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#475766';ctx.font='16px Arial';ctx.fillText(v.date.slice(5),x-20,h-12)})}
function drawCharts(){let ex=$('chartExercise').value,a=entries.filter(x=>x.exercise===ex).sort((a,b)=>a.date.localeCompare(b.date));draw('weightChart',a.filter(x=>x.weight!==''&&x.weight!=null).map(x=>({date:x.date,y:+x.weight})),'kg');draw('repsChart',a.map(x=>({date:x.date,y:+x.reps})),lang==='de'?'Wdh.':'Reps')}
$('chartExercise').onchange=drawCharts;
$('export').onclick=()=>{let blob=new Blob([JSON.stringify({entries,custom},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='krafttraining-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.entries)||!Array.isArray(d.custom))throw Error();if(!confirm(t('backupConfirm')))return;entries=d.entries;custom=d.custom;cancelEdit();save();alert(t('restored'))}catch{alert(t('invalid'))}finally{e.target.value=''}};
$('logDate').value=today();applyLang();suggest();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
</script></body></html>
