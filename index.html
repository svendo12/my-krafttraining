<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173c30"><link rel="manifest" href="manifest.webmanifest"><title>Mein Krafttraining</title><style>
:root{--bg:#f3f6f2;--card:#fff;--ink:#172a22;--muted:#465c50;--green:#176a43;--line:#c8d8ce;--red:#a12d31}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,-apple-system,sans-serif;padding-bottom:calc(100px + env(safe-area-inset-bottom))}header{background:#173c30;color:#fff;padding:calc(20px + env(safe-area-inset-top)) 18px 20px}header h1{font-size:29px;margin:0}header p{font-size:17px;margin:4px 0;color:#e2eee6}main{max-width:760px;margin:auto;padding:12px 14px}.panel,.item{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;margin:12px 0}.panel h2{font-size:24px;margin:0 0 10px}.item{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.item h3{font-size:21px;margin:0 0 4px;overflow-wrap:anywhere}.sub{font-size:17px;color:var(--muted)}label{display:block;font-weight:650;margin:16px 0 6px}input,select,textarea,button{font:inherit;min-height:56px;border-radius:12px}input,select,textarea{width:100%;padding:12px;border:2px solid #8ca99a;background:white;color:var(--ink)}button{padding:12px 17px;background:#176a43;color:white;border:2px solid transparent;font-weight:700;cursor:pointer}button.secondary{background:#e2eee6;color:#173c30;border-color:#b8cfc1}button.danger{background:#a12d31}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid #e6a23c;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}}.hidden{display:none!important}.dot{display:inline-block;width:15px;height:15px;border-radius:50%;margin-right:8px}.green{background:#18804e}.orange{background:#c2760a}.red{background:#bc343a}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button{margin:0}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);b </style></head><body><header><div class="top-tools"><label for="language" id="languageLabel" style="margin:0;color:white">Sprache</label><select id="language" aria-label="Sprache / Language"><option value="de">Deutsch</option><option value="en">English</option></select></div><h1 data-i="title">Mein Krafttraining</h1><p data-i="subtitle">Training dokumentieren · Fortschritt verfolgen</p></header><main>
<section id="status" class="tab"><div class="panel"><h2 data-i="exercises">Geräte & Übungen</h2><p class="sub" data-i="sortHint">Am längsten nicht trainierte Übungen stehen oben.</p><div id="exerciseList"></div><label for="newExercise" data-i="newExercise">Neue Übung / neues Gerät</label><input id="newExercise" maxlength="100" data-ph="example" placeholder="z. B. Beinpresse"><button id="addExercise" data-i="addExercise">Übung hinzufügen</button></div></section>
<section id="log" class="tab hidden"><div class="panel"><h2 id="logHeading" data-i="saveTraining">Training eintragen</h2><label for="logExercise" data-i="exercise">Übung / Gerät</label><select id="logExercise"></select><div class="grid"><div><label for="logDate" data-i="date">Datum</label><input type="date" id="logDate"></div><div><label for="weight" data-i="weight">Gewicht (kg)</label><input type="number" id="weight" min="0" step="0.5" inputmode="decimal"></div><div><label for="sets" data-i="sets">Sätze</label><input type="number" id="sets" min="1" step="1" inputmode="numeric" value="3"></div><div><label for="reps" data-i="reps">Wiederholungen je Satz</label><input type="number" id="reps" min="1" step="1" inputmode="numeric" value="10"></div></div><label for="notes" data-i="notes">Notiz (optional)</label><textarea id="notes" rows="3"></textarea><p class="sub" id="suggestion" aria-live="polite"></p><div class="actions"><button id="saveLog" data-i="saveTraining">Training speichern</button><button id="cancelEdit" class="secondary hidden" data-i="cancel">Abbrechen</button></div></div></section>

</main><nav class="bottom-nav" aria-label="Navigation"><button data-tab="status" class="active" data-i="overview">Übersicht</button><button data-tab="log" data-i="training">Training</button><button data-tab="charts" data-i="progress">Fortschritt</button><button data-tab="history" data-i="history">Verlauf</button></nav>
<script>
'use strict';const KEY='myKrafttraining.entries.v1',EXKEY='myKrafttraining.customExercises.v1',LANGKEY='myKrafttraining.language.v1';const $=id=>document.getElementById(id);const dict={de:{title:'Mein Krafttraining',subtitle:'Training dokumentieren · Fortschritt verfolgen',exercises:'Geräte & Übungen',sortHint:'Am längsten nicht trainierte Übungen stehen oben.',newExercise:'Neue Übung / neues Gerät',example:'z. B. Beinpresse',addExercise:'Übung hinzufügen',saveTraining:'Training speichern',editTraining:'Training bearbeiten',exercise:'Übung / Gerät',date:'Datum',weight:'Gewicht (kg)',sets:'Sätze',reps:'Wiederholungen je Satz',notes:'Notiz (optional)',cancel:'Abbrechen',progress:'Fortschritt',chooseExercise:'Übung auswählen',history:'Trainingsverlauf',export:'Backup exportieren',import:'Backup wiederherstellen (JSON)',backupHint:'Vor dem Gerätewechsel ein Backup exportieren.',overview:'Übersicht',training:'Training',language:'Sprache',never:'Noch nie trainiert',days:n=>`vor ${n} Tag(en)`,emptyExercises:'Noch keine Übungen vorhanden. Füge deine erste Übung hinzu.',emptyHistory:'Noch keine Trainings eingetragen.',remove:'Entfernen',edit:'Bearbeiten',delete:'Löschen',duplicate:'Diese Übung gibt es bereits.',confirmExercise:n=>`„${n}“ entfernen? Frühere Trainingseinträge bleiben erhalten.`,confirmEntry:'Diesen Trainingseintrag endgültig löschen?',invalid:'Bitte Übung, Datum, Sätze und Wiederholungen korrekt ausfüllen.',saved:'Training gespeichert.',updated:'Training aktualisiert.',deleted:'Eintrag gelöscht.',last:'Zuletzt verwendete Werte wurden übernommen.',noData:'Noch keine Daten vorhanden',confirmImport:'Aktuelle Daten durch das Backup ersetzen?',badBackup:'Backup-Datei ist ungültig.',imported:'Backup wiederhergestellt.',emptySelect:'Bitte zuerst eine Übung hinzufügen.'},en:{title:'My Strength Training',subtitle:'Log workouts · Track progress',exercises:'Equipment & exercises',sortHint:'Exercises not trained for the longest time appear first.',newExercise:'New exercise / equipment',example:'e.g. Leg press',addExercise:'Add exercise',saveTraining:'Save workout',editTraining:'Edit workout',exercise:'Exercise / equipment',date:'Date',weight:'Weight (kg)',sets:'Sets',reps:'Repetitions per set',notes:'Note (optional)',cancel:'Cancel',progress:'Progress',chooseExercise:'Choose exercise',history:'Workout history',export:'Export backup',import:'Restore backup (JSON)',backupHint:'Export a backup before switching devices.',overview:'Overview',training:'Workout',language:'Language',never:'Never trained',days:n=>`${n} day(s) ago`,emptyExercises:'No exercises yet. Add your first exercise.',emptyHistory:'No workouts logged yet.',remove:'Remove',edit:'Edit',delete:'Delete',duplicate:'This exercise already exists.',confirmExercise:n=>`Remove “${n}”? Previous workout entries will remain.`,confirmEntry:'Permanently delete this workout entry?',invalid:'Please enter a valid exercise, date, sets and repetitions.',saved:'Workout saved.',updated:'Workout updated.',deleted:'Entry deleted.',last:'Previous values were filled in.',noData:'No data available yet',confirmImport:'Replace current data with this backup?',badBackup:'Invalid backup file.',imported:'Backup restored.',emptySelect:'Add an exercise first.'}};
function load(k){try{const a=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(a)?a:[]}catch{return []}}let entries=load(KEY),custom=load(EXKEY).filter(x=>typeof x==='string'),lang=localStorage.getItem(LANGKEY)==='en'?'en':'de',editing=-1,active='status';const t=k=>dict[lang][k];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const validDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&!Number.isNaN(Date.parse(d));function save(){localStorage.setItem(KEY,JSON.stringify(entries));localStorage.setItem(EXKEY,JSON.stringify(custom));render()}function lastDate(ex){return entries.filter(x=>x.exercise===ex&&validDate(x.date)).map(x=>x.date).sort().at(-1)||''}function daysSince(d){return d?Math.max(0,Math.floor((new Date(today()+'T12:00:00')-new Date(d+'T12:00:00'))/86400000)):null}function status(ex){const n=daysSince(lastDate(ex));return n===null?['red',t('never')]:[n<=2?'green':n<=4?'orange':'red',t('days')(n)]}function setTab(id){active=id;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('hidden',x.id!==id));document.querySelectorAll('[data-tab]').forEach(b=>{let on=b.dataset.tab===id;b.classList.toggle('active',on);b.setAttribute('aria-current',on?'page':'false')});render();window.scrollTo({top:0,behavior:'instant'})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));function fillSelect(id,arr){const el=$(id),old=el.value;el.replaceChildren();for(const s of arr){const op=document.createElement('option');op.value=s;op.textContent=s;el.append(op)}if(arr.includes(old))el.value=old}function render(){document.documentElement.lang=lang;$('language').value=lang;$('languageLabel').textContent=t('language');document.querySelectorAll('[data-i]').forEach(e=>{if(e.id==='logHeading'||e.id==='saveLog'){e.textContent=t(editing>=0?'editTraining':'saveTraining')}else e.textContent=t(e.dataset.i)});document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));let sorted=custom.slice().sort((a,b)=>{let x=daysSince(lastDate(a)),y=daysSince(lastDate(b));return (x===null?-1:-x)-(y===null?-1:-y)});$('exerciseList').innerHTML=sorted.map(ex=>{let [c,txt]=status(ex);return `<div class="item"><div class="item-main"><h3><span class="dot ${c}" aria-hidden="true"></span>${esc(ex)}</h3><div class="sub">${esc(txt)}</div></div><button class="danger" data-remove="${esc(ex)}">${t('remove')}</button></div>`}).join('')||`<p class="sub">${t('emptyExercises')}</p>`;fillSelect('logExercise',custom);fillSelect('chartExercise',custom);$('saveLog').disabled=custom.length===0&&editing<0;$('historyList').innerHTML=entries.map((x,i)=>({...x,_i:i})).sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(x=>`<div class="item"><div class="item-main"><h3>${esc(x.exercise)}</h3><div class="sub">${esc(x.date)} · ${x.weight!==''&&x.weight!=null?esc(x.weight)+' kg · ':''}${esc(x.sets)} × ${esc(x.reps)}${x.notes?' · '+esc(x.notes):''}</div></div><div class="actions"><button class="secondary" data-edit="${x._i}">${t('edit')}</button><button class="danger" data-del="${x._i}">${t('delete')}</button></div></div>`).join('')||`<p class="sub">${t('emptyHistory')}</p>`;drawCharts()}
$('language').onchange=e=>{lang=e.target.value;localStorage.setItem(LANGKEY,lang);render()};$('addExercise').onclick=()=>{const v=$('newExercise').value.trim();if(!v)return;if(custom.some(x=>x.toLowerCase()===v.toLowerCase()))return alert(t('duplicate'));custom.push(v);$('newExercise').value='';save()};$('newExercise').onkeydown=e=>{if(e.key==='Enter')$('addExercise').click()};$('exerciseList').onclick=e=>{let b=e.target.closest('[data-remove]');if(!b)return;let ex=b.dataset.remove;if(confirm(t('confirmExercise')(ex))){custom=custom.filter(x=>x!==ex);save()}};
function suggest(ex){if(editing>=0)return;let last=entries.filter(x=>x.exercise===ex).sort((a,b)=>String(b.date).localeCompare(String(a.date))).at(0);$('suggestion').textContent=last?t('last'):'';if(last){$('weight').value=last.weight??'';$('sets').value=last.sets??3;$('reps').value=last.reps??10}else{$('weight').value='';$('sets').value=3;$('reps').value=10}}$('logExercise').onchange=e=>suggest(e.target.value);$('logDate').value=today();function resetForm(){editing=-1;$('logDate').value=today();$('notes').value='';$('cancelEdit').classList.add('hidden');render();suggest($('logExercise').value)}$('cancelEdit').onclick=resetForm;$('saveLog').onclick=()=>{const exercise=$('logExercise').value,date=$('logDate').value,weight=$('weight').value,sets=Number($('sets').value),reps=Number($('reps').value);if(!exercise||!validDate(date)||!Number.isInteger(sets)||sets<1||!Number.isInteger(reps)||reps<1||(weight!==''&&(!Number.isFinite(Number(weight))||Number(weight)<0)))return alert(t('invalid'));const x={exercise,date,weight,sets,reps,notes:$('notes').value};if(editing>=0){entries[editing]=x;save();alert(t('updated'))}else{entries.push(x);save();alert(t('saved'))}resetForm()};$('historyList').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.edit!==undefined){editing=Number(b.dataset.edit);let x=entries[editing];if(!custom.includes(x.exercise))custom.push(x.exercise);render();$('logExercise').value=x.exercise;$('logDate').value=x.date;$('weight').value=x.weight??'';$('sets').value=x.sets;$('reps').value=x.reps;$('notes').value=x.notes||'';$('suggestion').textContent='';$('cancelEdit').classList.remove('hidden');setTab('log')}else if(b.dataset.del!==undefined&&confirm(t('confirmEntry'))){let i=Number(b.dataset.del);entries.splice(i,1);if(editing===i)resetForm();save()}};
function draw(id,values,label){let c=$(id),ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.font='19px system-ui';ctx.fillStyle='#465c50';ctx.strokeStyle='#d5e0d9';for(let i=0;i<5;i++){let y=25+i*42;ctx.beginPath();ctx.moveTo(55,y);ctx.lineTo(w-20,y);ctx.stroke()}if(!values.length){ctx.fillText(t('noData'),60,112);return}let max=Math.max(1,...values.map(v=>v.y)),min=Math.min(0,...values.map(v=>v.y)),span=max-min||1;ctx.fillText(label,12,20);ctx.strokeStyle='#176a43';ctx.lineWidth=4;ctx.beginPath();values.forEach((v,i)=>{let x=60+(values.length===1?0:i*(w-100)/(values.length-1)),y=25+(max-v.y)*170/span;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle='#176a43';values.forEach((v,i)=>{let x=60+(values.length===1?0:i*(w-100)/(values.length-1)),y=25+(max-v.y)*170/span;ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();if(values.length<=8){ctx.fillStyle='#465c50';ctx.fillText(v.date.slice(5),Math.min(w-60,Math.max(5,x-22)),h-8);ctx.fillStyle='#176a43'}})}function drawCharts(){let ex=$('chartExercise').value,a=entries.filter(x=>x.exercise===ex).sort((a,b)=>String(a.date).localeCompare(String(b.date)));draw('weightChart',a.filter(x=>x.weight!==''&&x.weight!=null).map(x=>({date:x.date,y:Number(x.weight)})),'kg');draw('repsChart',a.map(x=>({date:x.date,y:Number(x.reps)})),t('reps'))}$('chartExercise').onchange=drawCharts;
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({entries,custom},null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='krafttraining-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importFile').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.entries)||!Array.isArray(d.custom)||!d.custom.every(x=>typeof x==='string')||!d.entries.every(x=>x&&typeof x.exercise==='string'&&validDate(x.date)&&Number.isFinite(Number(x.sets))&&Number.isFinite(Number(x.reps))))throw Error();if(!confirm(t('confirmImport')))return;entries=d.entries;custom=d.custom;resetForm();save();alert(t('imported'))}catch{alert(t('badBackup'))}finally{e.target.value=''}};render();suggest($('logExercise').value);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
</script></body></html>
